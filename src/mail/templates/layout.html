<!doctype html>
<html lang="es" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="google" content="notranslate" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #100d16;
        font-family: Arial, Helvetica, sans-serif;
      }

      a {
        text-decoration: none;
      }

      @media screen and (max-width: 600px) {
        .email-container {
          width: 100% !important;
        }

        .content {
          padding: 28px 20px !important;
        }
      }
    </style>
  </head>

  <body style="margin: 0; padding: 0; background-color: #100d16">
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      bgcolor="#100d16"
    >
      <tr>
        <td align="center" style="padding: 40px 15px">
          <table
            role="presentation"
            class="email-container"
            width="600"
            cellspacing="0"
            cellpadding="0"
            border="0"
            bgcolor="#191521"
            style="
              width: 600px;
              max-width: 600px;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                align="center"
                bgcolor="#21152f"
                style="padding: 35px 25px; border-bottom: 1px solid #352443"
              >
                <h1
                  style="
                    margin: 0;
                    color: #ffffff;
                    font-size: 27px;
                    letter-spacing: 2px;
                  "
                >
                  Nest backend
                </h1>

                <p
                  style="
                    margin: 10px 0 0;
                    color: #b99acb;
                    font-size: 12px;
                    letter-spacing: 3px;
                  "
                >
                  MAIL TEST
                </p>
              </td>
            </tr>
            <tr>
              <td
                class="content"
                style="
                  padding: 40px 45px;
                  color: #e8e3ed;
                  font-size: 15px;
                  line-height: 1.7;
                "
              >
                {{{ body }}}
              </td>
            </tr>
            <tr>
              <td
                align="center"
                bgcolor="#120e19"
                style="padding: 25px 20px; border-top: 1px solid #352443"
              >
                <p style="margin: 0 0 8px; color: #b99acb; font-size: 12px">
                  ©All rights reserved.
                </p>

                <p style="margin: 0; color: #766b80; font-size: 11px">
                  This email has been generated automatically. Please do not
                  reply to this message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
