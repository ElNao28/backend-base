<h2 style="margin: 0 0 20px; color: #191521; font-size: 22px">
  Cuenta creada correctamente
</h2>

<p style="margin: 0 0 18px; color: #4b4650">Hola, {{name}}.</p>

<p style="margin: 0 0 25px; color: #4b4650">
  Tu cuenta ha sido creada correctamente. Ya puedes iniciar sesión utilizando
  tus credenciales.
</p>

<table
  role="presentation"
  cellspacing="0"
  cellpadding="0"
  border="0"
  align="center"
>
  <tr>
    <td align="center" bgcolor="#6d28a8" style="border-radius: 6px">
      <a
        href="{{loginUrl}}"
        style="
          display: inline-block;
          padding: 13px 28px;
          color: #ffffff;
          font-size: 14px;
          font-weight: bold;
          text-decoration: none;
        "
      >
        Iniciar sesión
      </a>
    </td>
  </tr>
</table>
